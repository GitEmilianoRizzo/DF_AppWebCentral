# ============================================
# DF Group - Docker Compose
# Demo stack: Frontend + Backend + SQL Server
# ============================================

version: '3.8'

services:
  # ----------------------------------------
  # Frontend (React + Nginx)
  # ----------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api/v1
    container_name: dfgroup-frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - dfgroup-network
    restart: unless-stopped

  # ----------------------------------------
  # Backend API (.NET 9)
  # ----------------------------------------
  api:
    build:
      context: .
      dockerfile: backend/DFGroup.Api/Dockerfile
    container_name: dfgroup-api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DFGroupDb=${DB_CONNECTION_STRING:-Server=sqlserver;Database=DF_DTW_APP;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True}
      - Serilog__MinimumLevel__Default=Information
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - dfgroup-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ----------------------------------------
  # SQL Server (Demo only)
  # En produccion usar SQL Server externo
  # ----------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dfgroup-sqlserver
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SA_PASSWORD:-YourStrong@Passw0rd}
      - MSSQL_PID=Developer
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - dfgroup-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

networks:
  dfgroup-network:
    driver: bridge

volumes:
  sqlserver-data:
    driver: local
